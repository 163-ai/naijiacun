<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 形象展台 · 奶家村</title>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
  <link rel="modulepreload" href="vendor/three/three.core.min.js">
  <link rel="modulepreload" href="vendor/three/three.module.min.js">
  <link rel="modulepreload" href="vendor/three/GLTFLoader.js">
  <link rel="modulepreload" href="vendor/meshopt/meshopt_decoder.module.js">
  <link rel="preload" as="fetch" href="https://testingcf.jsdelivr.net/gh/163-ai/naijiacun@main/assets/models/nailong-waving.glb" crossorigin="anonymous">
  <link rel="preload" as="image" href="assets/characters/3d/nailong-waving-pet-sm.webp?v=waving-1">
  <link rel="stylesheet" href="css/style.css?v=village-1">
  <link rel="stylesheet" href="css/pet.css?v=browser-pets-1">
  <link rel="stylesheet" href="css/pet3d.css?v=angry-1">
  <link rel="stylesheet" href="css/pet3d-actions.css?v=angry-1">
  <link rel="stylesheet" href="css/village.css?v=village-1">
</head>
<body class="village-theme p3-page">
  <main class="p3-wrap">
    <header class="p3-head">
      <div>
        <span class="p3-kicker">换个角度认识邻居</span>
        <h1>村民 3D 展台</h1>
        <p>把喜欢的村民放到眼前，转一圈，看看它的每一面。</p>
      </div>
      <a class="p3-back" href="pet.html">← 回桌宠小院</a>
    </header>

    <div class="p3-main">
      <div id="stage" class="p3-stage">
        <canvas id="gl"></canvas>
        <div class="p3-views" aria-label="观察方向">
          <button class="p3-btn" id="frontBtn" data-view="front" aria-pressed="false">正面</button>
          <button class="p3-btn" id="sideBtn" data-view="side" aria-pressed="false">侧面</button>
          <button class="p3-btn" id="backBtn" data-view="back" aria-pressed="false">背面</button>
        </div>
        <div id="loading" class="p3-loading" role="status" aria-live="polite">
          <img id="modelPreview" class="p3-preview" alt="" decoding="async" draggable="false"
               src="assets/characters/3d/nailong-waving-pet-sm.webp?v=waving-1">
          <div class="p3-load-copy">
            <strong id="loadLabel">正在加载模型…</strong>
            <progress id="loadProgress" max="100" aria-label="模型下载进度"></progress>
            <span id="loadDetail">模型准备好后，即可拖动旋转。</span>
          </div>
        </div>
        <div id="fallback" class="p3-fallback hidden" role="status"><p id="errorMessage"></p><button id="retryBtn" class="p3-btn">重新加载</button></div>
        <div id="bubble" class="p3-bubble hidden"></div>
        <div id="rageFx" class="p3-rage" aria-hidden="true"></div>
        <div id="laughFx" class="p3-fx" aria-hidden="true"></div>
        <div class="p3-hint">按住拖拽旋转 · 滚轮缩放 · 双击复位</div>
        <div class="p3-corner">村民立体档案 <span>360°</span></div>
      </div>

      <aside class="p3-side">
        <section class="p3-select" aria-labelledby="p3RosterTitle">
          <div class="p3-section-head"><h2 id="p3RosterTitle">哪位村民上台？</h2><span>点选切换</span></div>
          <div id="chips" class="p3-chips" aria-label="选择 3D 角色"></div>
        </section>

        <section class="p3-actions" aria-labelledby="p3ActTitle">
          <div class="p3-section-head">
            <h2 id="p3ActTitle">动作</h2>
            <button id="soundBtn" class="p3-sound" type="button" aria-pressed="true" title="切换动作音效">🔊 有声音</button>
          </div>
          <div class="p3-cats" role="tablist" aria-label="动作分类">
            <button class="p3-cat on" type="button" role="tab" data-cat="mood" aria-selected="true">😄 情绪</button>
            <button class="p3-cat" type="button" role="tab" data-cat="interact" aria-selected="false">👋 互动</button>
          </div>
          <div class="p3-act-list" data-panel="mood">
            <button class="p3-act" type="button" data-act="laugh">
              <span class="p3-act-emoji" aria-hidden="true">🤣</span>
              <span class="p3-act-text"><b>捧腹大笑</b><em>捂着肚子笑到前仰后合</em></span>
            </button>
            <button class="p3-act" type="button" data-act="angry">
              <span class="p3-act-emoji" aria-hidden="true">😤</span>
              <span class="p3-act-text"><b>愤怒呐喊</b><em>憋气鼓起，跺脚冲你吼一嗓子</em></span>
            </button>
          </div>
          <div class="p3-act-list hidden" data-panel="interact">
            <button class="p3-act" type="button" data-act="jump">
              <span class="p3-act-emoji" aria-hidden="true">🦘</span>
              <span class="p3-act-text"><b>蹦一下</b><em>原地蹦起来再落回去</em></span>
            </button>
          </div>
          <p class="p3-act-note" id="actNote">情绪档：大笑会笑到歪倒在地再爬起来；愤怒呐喊先憋气下蹲，再冲你吼、气到跺脚，最后喘气收尾。</p>
        </section>

        <div class="p3-tools" aria-label="模型操作">
          <button class="p3-btn" id="spinBtn" aria-pressed="true" title="自动旋转观察完整角色">🔄 自动展示</button>
          <button class="p3-btn" id="wireBtn" aria-pressed="false" title="显示真实的三角网格">🧱 线框</button>
          <button class="p3-btn" id="talkBtn">🔊 说句话</button>
          <button class="p3-btn" id="clipBtn">🎵 原声</button>
          <button class="p3-btn" id="resetBtn">↩️ 复位视角</button>
          <button class="p3-btn primary" id="pinBtn" title="让当前村民悬浮在奶家村各个页面">🐾 变桌宠</button>
          <p class="pet-browser-note">站内使用无需安装。</p>
        </div>
        <p id="status" class="p3-status">准备中…</p>

        <div class="p3-panel">
          <h3>模型来源</h3>
          <p id="modelCredit" class="p3-source-credit"></p>
          <a id="modelSource" class="p3-source-link" target="_blank" rel="noopener noreferrer">查看模型与来源 ↗</a>
          <p id="modelLicense" class="p3-mini"></p>
        </div>
        <p id="missingModels" class="p3-caveat"></p>
      </aside>
    </div>
  </main>

  <script src="js/data.js?v=browser-pets-1"></script>
  <script src="js/3d-models.js?v=mini-2"></script>
  <script src="js/site-pet.js?v=fast-pet-2"></script>
  <script type="module" src="js/pet3d.js?v=fast-open-3"></script>
  <script src="js/village.js?v=village-1"></script>
  <script>
    window.addEventListener("load", function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches && window.__p3) window.__p3.spin(false);
    });
  </script>
</body>
</html>
