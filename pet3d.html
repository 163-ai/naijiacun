<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 形象展台 · 奶家村</title>
  <link rel="stylesheet" href="css/style.css?v=village-1">
  <link rel="stylesheet" href="css/pet3d.css?v=village-1">
  <link rel="stylesheet" href="css/village.css?v=village-1">
</head>
<body class="village-theme p3-page">
  <main class="p3-wrap">
    <header class="p3-head">
      <div>
        <span class="p3-kicker">换个角度认识邻居</span>
        <h1>村民 3D 展台</h1>
        <p>把喜欢的村民放到眼前，转一圈，看看它的每一面。</p>
      </div>
      <a class="p3-back" href="pet.html">← 回桌宠小院</a>
    </header>

    <div class="p3-main">
      <div id="stage" class="p3-stage">
        <canvas id="gl"></canvas>
        <div class="p3-views" aria-label="观察方向">
          <button class="p3-btn" id="frontBtn" data-view="front" aria-pressed="false">正面</button>
          <button class="p3-btn" id="sideBtn" data-view="side" aria-pressed="false">侧面</button>
          <button class="p3-btn" id="backBtn" data-view="back" aria-pressed="false">背面</button>
        </div>
        <div id="loading" class="p3-loading" role="status">正在加载模型…</div>
        <div id="fallback" class="p3-fallback hidden" role="status"><p id="errorMessage"></p><button id="retryBtn" class="p3-btn">重新加载</button></div>
        <div id="bubble" class="p3-bubble hidden"></div>
        <div class="p3-hint">按住拖拽旋转 · 滚轮缩放 · 双击复位</div>
        <div class="p3-corner">村民立体档案 <span>360°</span></div>
      </div>

      <aside class="p3-side">
        <section class="p3-select" aria-labelledby="p3RosterTitle">
          <div class="p3-section-head"><h2 id="p3RosterTitle">哪位村民上台？</h2><span>点选切换</span></div>
          <div id="chips" class="p3-chips" aria-label="选择 3D 角色"></div>
        </section>

        <div class="p3-tools" aria-label="模型操作">
          <button class="p3-btn" id="spinBtn" aria-pressed="true" title="自动旋转观察完整角色">🔄 自动展示</button>
          <button class="p3-btn" id="wireBtn" aria-pressed="false" title="显示真实的三角网格">🧱 线框</button>
          <button class="p3-btn" id="talkBtn">🔊 说句话</button>
          <button class="p3-btn" id="clipBtn">🎵 原声</button>
          <button class="p3-btn" id="resetBtn">↩️ 复位视角</button>
          <button class="p3-btn primary" id="pinBtn">📌 置顶小窗</button>
        </div>
        <p id="status" class="p3-status">准备中…</p>

        <div class="p3-panel">
          <h3>模型来源</h3>
          <p id="modelCredit" class="p3-source-credit"></p>
          <a id="modelSource" class="p3-source-link" target="_blank" rel="noopener noreferrer">查看模型与来源 ↗</a>
          <p id="modelLicense" class="p3-mini"></p>
        </div>
        <p id="missingModels" class="p3-caveat"></p>
      </aside>
    </div>
  </main>

  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
  <script src="js/data.js?v=village-1"></script>
  <script src="js/3d-models.js?v=user-models-9"></script>
  <script type="module" src="js/pet3d.js?v=user-models-9"></script>
  <script src="js/village.js?v=village-1"></script>
  <script>
    window.addEventListener("load", function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches && window.__p3) window.__p3.spin(false);
    });
  </script>
</body>
</html>
