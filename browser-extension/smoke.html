<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; require-trusted-types-for 'script'"><title>桌宠扩展检查</title><link rel="stylesheet" href="smoke.css"></head>
<body><main><h1>村民跨网页检查</h1><p>扩展需先加载 <code>browser-extension/dist</code>。本页使用严格 CSP；页面按钮通过官网桥接请求，不直接访问扩展 API。</p><div class="controls"><label>村民 <select id="villager"><option value="nailong">奶龙</option><option value="naiwa">奶蛙</option><option value="baobaolong">暴暴龙</option><option value="xiaoqi">小七</option><option value="niulai">牛来</option><option value="capybara">卡皮巴拉</option><option value="naicha">奶察</option><option value="naidan">奶蛋</option><option value="feidudu">肥嘟嘟袋鼠</option><option value="xiaocao">小草</option></select></label><label>模式 <select id="mode"><option value="3d">真实3D</option><option value="2d">透明平面</option></select></label><button id="ping">检查连接</button><button id="start">请出</button><button id="stop">收回</button></div><pre id="status" role="status">等待操作</pre><h2>透明点击网格</h2><p>将村民拖到网格上，点透明区域与腿部空隙；对应格子的计数应增加。拖身体时不应触发网格。</p><output id="click-log">还没有点击网格</output><div id="grid"></div></main><script src="smoke.js"></script></body></html>
