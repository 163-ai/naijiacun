<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌宠模式 · 奶家村</title>
<meta name="description" content="下载奶家村 Windows 透明桌宠，让村民浮在桌面上；也能在网页小院里拖动、聊天。">
<link rel="stylesheet" href="css/style.css?v=village-1">
<link rel="stylesheet" href="css/pet.css?v=desktop-1">
<link rel="stylesheet" href="css/village.css?v=village-1">
</head>
<body class="village-theme pet-page">

<main class="pet-wrap">
<header class="pet-head">
  <div>
    <span class="pet-kicker">村里的慢时光</span>
    <h1>桌宠陪伴</h1>
    <p>领一位村民来小院坐坐。拖一拖、聊两句，也能下载透明桌宠陪在桌面上。</p>
  </div>
  <a class="pet-back" href="index.html">← 回村民名册</a>
</header>

<section class="pet-download" aria-label="Windows 透明桌宠下载">
  <a class="pet-btn primary" href="downloads/naijiacun-pet-windows.zip" download>↓ Windows 透明桌宠</a>
  <p>Windows 免安装 · 解压后双击运行，拖动移动，右键切换或退出。</p>
</section>

<section class="pet-roster" aria-labelledby="petRosterTitle">
  <div class="pet-section-head">
    <h2 id="petRosterTitle">今天，谁来陪你？</h2>
    <span>点选一位村民</span>
  </div>
  <div class="pet-chars" id="charBar" aria-label="选择桌宠角色"></div>
</section>

<div class="pet-toolbar" aria-label="桌宠操作">
  <button class="pet-btn" id="pinBtn" title="浏览器置顶小窗，会保留背景和来源栏">📌 浏览器小窗</button>
  <button class="pet-btn" id="talkBtn">💬 说句话</button>
  <button class="pet-btn" id="wanderBtn">🚶 随便走走</button>
  <button class="pet-btn" id="depthBtn" aria-pressed="true" title="切换 2.5D 立体 / 平面">🧊 立体感</button>
  <a class="pet-btn" href="pet3d.html" title="真 WebGL 3D 网格，可拖拽 360° 旋转">🌀 真 3D 版</a>
  <label class="pet-size">大小
    <input type="range" id="sizeRange" min="80" max="220" step="4" value="132">
  </label>
</div>

<div class="pet-stage" id="petStage" aria-label="桌宠小院，可拖动角色">
  <span class="pet-yard-label" aria-hidden="true">村口小院 <i>·</i> 今日宜发呆</span>
  <span class="pet-yard-window" aria-hidden="true"></span>
</div>

<!-- 和桌宠聊天：回复直接弹在它头上，同时用它的音色念出来 -->
<div class="pet-chat" id="petChat">
  <div class="pet-chat-log" id="chatLog" aria-live="polite"></div>
  <form class="pet-chat-form" id="chatForm">
    <input id="chatInput" type="text" maxlength="300" autocomplete="off"
           aria-label="跟桌宠说句话"
           placeholder="跟它说句话…（Enter 发送）">
    <button type="submit" id="chatSend">发送</button>
    <a class="pet-chat-cfg" href="chat.html" title="配置大模型接口" aria-label="聊天设置">⚙️</a>
  </form>
</div>

<p class="pet-note" id="petNote">点一下它试试。</p>
</main>

<script src="js/data.js?v=lossless-1"></script>
<script src="js/avatars.js"></script>
<script src="js/tts.js?v=village-1"></script>
<script src="js/chat.js?v=lossless-1"></script>
<script src="js/pet.js?v=user-models-9"></script>
<script src="js/pet-page.js?v=desktop-1"></script>
<script src="js/village.js?v=village-1"></script>
</body>
</html>
