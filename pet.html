<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌宠模式 · 奶家村</title>
<meta name="description" content="把奶家村的角色变成一只会走会瞌睡的桌宠，还能浮在其他窗口上面。">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pet.css?v=user-models-9">
</head>
<body class="pet-page">

<header class="pet-head">
  <a class="pet-back" href="index.html">← 回到图鉴</a>
  <h1>桌宠模式</h1>
  <p>拖它、点它说话；移动鼠标它会转头看你，点「置顶小窗」可以浮在其他窗口上面，干别的活时它也在旁边。</p>
</header>

<section class="pet-chars" id="charBar"></section>

<div class="pet-toolbar">
  <button class="pet-btn primary" id="pinBtn">📌 置顶小窗</button>
  <button class="pet-btn" id="talkBtn">💬 说句话</button>
  <button class="pet-btn" id="wanderBtn">🚶 随便走走</button>
  <button class="pet-btn" id="depthBtn" aria-pressed="true" title="切换 2.5D 立体 / 平面">🧊 立体感</button>
  <a class="pet-btn" href="pet3d.html" title="真 WebGL 3D 网格，可拖拽 360° 旋转">🌀 真 3D 版</a>
  <label class="pet-size">大小
    <input type="range" id="sizeRange" min="80" max="220" step="4" value="132">
  </label>
</div>

<div class="pet-stage" id="petStage"></div>

<!-- 和桌宠聊天：回复直接弹在它头上，同时用它的音色念出来 -->
<div class="pet-chat" id="petChat">
  <div class="pet-chat-log" id="chatLog" aria-live="polite"></div>
  <form class="pet-chat-form" id="chatForm">
    <input id="chatInput" type="text" maxlength="300" autocomplete="off"
           placeholder="跟它说句话…（Enter 发送）">
    <button type="submit" id="chatSend">发送</button>
    <a class="pet-chat-cfg" href="chat.html" title="配置大模型接口">⚙️</a>
  </form>
</div>

<p class="pet-note" id="petNote">点一下它试试。</p>

<script src="js/data.js?v=user-models-9"></script>
<script src="js/avatars.js"></script>
<script src="js/tts.js"></script>
<script src="js/chat.js"></script>
<script src="js/pet.js?v=user-models-9"></script>
<script src="js/pet-page.js"></script>
</body>
</html>
